<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primera prova Javascript</title>
</head>
<body>
    <button onClick = "executa()">CLICA'M</button>

        }
    </script>
