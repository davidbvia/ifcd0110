<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fer una calculadora</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="calculadora.js" defer></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.1/css/all.css" crossorigin="anonymous">
</head>

<body>
    <div id="main-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path
                d="M544 160C544 124.7 515.3 96 480 96L160 96C124.7 96 96 124.7 96 160L96 480C96 515.3 124.7 544 160 544L480 544C515.3 544 544 515.3 544 480L544 160zM276.9 508.9C243.2 508.9 223.7 491.5 213.7 470.4L248 449.7C254.6 461.4 260.6 471.3 275.1 471.3C288.9 471.3 297.7 465.9 297.7 444.8L297.7 301.7L339.8 301.7L339.8 445.4C339.8 489 314.2 508.9 276.9 508.9zM362.7 465.9L397 446.1C406 460.8 417.8 471.7 438.5 471.7C455.9 471.7 467.1 463 467.1 450.9C467.1 436.5 455.7 431.4 436.4 422.9L425.9 418.4C395.5 405.5 375.4 389.2 375.4 354.9C375.4 323.3 399.5 299.3 437 299.3C463.8 299.3 483 308.6 496.8 333L464 354C456.8 341.1 449 336 436.9 336C424.6 336 416.8 343.8 416.8 354C416.8 366.6 424.6 371.7 442.7 379.6L453.2 384.1C489 399.4 509.1 415.1 509.1 450.3C509.1 488.1 479.3 508.9 439.4 508.9C400.3 508.9 375 490.3 362.7 465.9z" />
        </svg>
        <h1>
            Calculadora Javascript
        </h1>
    </div>
    <div id="layout">
        <!-- Calculadora -->
        <div class="wrapper">
            <h3>Crear una Calculadora web</h3>
            <div id="calculadora">
                <!-- display -->
                <div id="display">
                    <!-- operacions -->
                    <div id="operacions">

                    </div>
                    <!-- resultats -->
                    <div id="resultats">

                    </div>
                </div>
                <div id="botoneres">
                    <div class="fila">
                        <button class="btn" onclick="emmagatzema('1')">1</button>
                        <button class="btn" onclick="emmagatzema('2')">2</button>
                        <button class="btn" onclick="emmagatzema('3')">3</button>
                        <button class="btn" onclick="emmagatzema('%')">%</button>
                    </div>
                    <div class="fila">
                        <button class="btn" onclick="emmagatzema('4')">4</button>
                        <button class="btn" onclick="emmagatzema('5')">5</button>
                        <button class="btn" onclick="emmagatzema('6')">6</button>
                        <button class="btn" onclick="emmagatzema('x')">x</button>
                    </div>
                    <div class="fila">
                        <button class="btn" onclick="emmagatzema('7')">7</button>
                        <button class="btn" onclick="emmagatzema('8')">8</button>
                        <button class="btn" onclick="emmagatzema('9')">9</button>
                        <button class="btn" onclick="emmagatzema('+')">+</button>
                    </div>
                    <div class="fila">
                        <button class="btn" onclick="emmagatzema('0')">0</button>
                        <button class="btn" onclick="emmagatzema('.')">.</button>
                        <button class="btn" onclick="resultat()">=</button>
                        <button class="btn" onclick="emmagatzema('-')">-</button>
                    </div>
                    <div class="fila">
                        <button class="btn" id="clean" onclick="neteja()">Netejar pantalla</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
